# Optional overlay: mount NAS NFS as /backups inside the container.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.nfs.yml up -d
#
# Requires Docker's local NFS volume driver and that the Docker host can
# reach BACKUP_NFS_HOST (often over an overlay VPN). If in-container NFS
# mounts are blocked, host-mount instead (see README) and skip this file.

services:
  dcengineer:
    volumes:
      - dce_backups:/backups

volumes:
  dce_backups:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${BACKUP_NFS_HOST:-nas.example.net},${NFS_MOUNT_OPTIONS:-rw,nfsvers=4,hard,timeo=600,retrans=2}"
      device: ":${BACKUP_NFS_EXPORT:-/mnt/pool/dce-backups}"
